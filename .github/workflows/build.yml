name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب كود المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا Java 17
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعداد بيئة Flutter بإصدار حديث يدعم المكتبات
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. تثبيت المكتبات المحددة في pubspec.yaml
    - name: Install Dependencies
      run: flutter pub get

    # 5. بناء ملف APK للتطبيق
    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    # 6. رفع ملف APK الناتج
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Daily-Cash-App
        path: build/app/outputs/flutter-apk/app-release.apk

    # 6. رفع ملف الـ APK الناتج باستخدام الإصدار الحديث v4
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Daily-Cash-App
        path: build/app/outputs/flutter-apk/app-release.apk
